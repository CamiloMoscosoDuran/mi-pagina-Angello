<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Asistente Angello</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body data-logged-in="{{ session.get('loggedin') | default(false) | tojson }}"
      data-user-name="{{ session.get('nombre', '') | e }}"
      data-user-id="{{ session.get('id', '') }}">

    <!-- Botón flotante del chatbot -->
    <div id="chatbot-container">
        <button id="chatbot-toggle" class="chat-button">
            <i class="fas fa-robot"></i>
            <span class="chat-notification" id="chat-notification">1</span>
        </button>

        <!-- Ventana del chat -->
        <div id="chat-window" class="chat-hidden">
            
            <!-- Header del chat -->
            <div class="chat-header">
                <div class="chat-avatar">
                    <img src="{{ url_for('static', filename='image/inicio/logo.png') }}" alt="Angello Bot" class="avatar-img">
                </div>
                <div class="chat-title">
                    <h3>Asistente Angello</h3>
                    <span class="status-indicator">
                        <i class="fas fa-circle"></i>
                        En línea
                    </span>
                </div>
                <div class="chat-controls">
                    <button id="minimize-button" class="control-button" title="Minimizar">
                        <i class="fas fa-minus"></i>
                    </button>
                    <button id="close-button" class="control-button" title="Cerrar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Área de mensajes -->
            <div class="chat-messages" id="chat-messages">
                <div class="typing-indicator" id="typing-indicator" style="display: none;">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="typing-text">Angello está escribiendo...</span>
                </div>
            </div>

            <!-- Sugerencias rápidas -->
            <div class="quick-suggestions" id="quick-suggestions">
                <!-- Las sugerencias se generarán dinámicamente por JavaScript -->
            </div>

            <!-- Input de mensajes -->
            <div class="chat-input">
                <button id="attach-btn" class="attach-button" title="Adjuntar">
                    <i class="fas fa-paperclip"></i>
                </button>
                <input type="text" id="chat-input-text" placeholder="Escribe tu mensaje..." autocomplete="off">
                <button id="send-button" class="send-button" title="Enviar">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

            <!-- Footer del chat -->
            <div class="chat-footer">
                <span class="powered-by">
                    <i class="fas fa-robot"></i>
                    Asistente Virtual Angello
                </span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chatbot-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
